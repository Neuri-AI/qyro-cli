[project]
name = "qyro-cli"
version = "1.0.0"
description = "A CLI for Qyro Engine app generator"
authors = [{ name = "Neuri", email = "ppg@neuri.ai" }]
maintainers = [
    { name = "Luis Alfredo De Los Reyes", email = "alfredo@neuri.ai" },
]
dynamic = ["classifiers"]
keywords = [
    "ppg", "python", "pyqt", "pyside", "desktop", "application",
    "generator", "cli", "component", "state management", "pyside6"
]
license = "MIT"
requires-python = ">=3.7,<3.16"
readme = "README.md"

dependencies = [
    "requests>=2.28.2,<2.32; python_version < '3.8'",
    "requests>=2.31.0,<2.34; python_version >= '3.8' and python_version < '3.10'",
    "requests>=2.34.2,<3.0.0; python_version >= '3.10'",

    "semver>=2.13.0,<3.0.0; python_version < '3.10'",
    "semver>=3.1.0,<4.0.0; python_version >= '3.10'",

    "rich>=13.7.1,<14.0.0; python_version < '3.9'",
    "rich>=14.0.0,<15.0.0; python_version >= '3.9' and python_version < '3.10'",
    "rich>=15.0.0,<16.0.0; python_version >= '3.10'",

    "prompt-toolkit>=3.0.47,<3.1.0; python_version < '3.10'",
    "prompt-toolkit>=3.0.53,<4.0.0; python_version >= '3.10'",

    "questionary>=1.10.0,<2.0.0; python_version < '3.9'",
    "questionary>=2.1.1,<3.0.0; python_version >= '3.9'",

    "qyro-engine @ git+https://github.com/Neuri-AI/qyro-engine.git",
]

[project.optional-dependencies]
desktop = [
    "pyinstaller>=5.13.2,<6.0.0; python_version < '3.8'",
    "pyinstaller>=6.22.3,<7.0.0; python_version >= '3.8'",
    "pillow>=9.5.0,<10.0.0; python_version < '3.8'",
    "pillow>=10.4.0,<11.0.0; python_version >= '3.8' and python_version < '3.10'",
    "pillow>=11.0.0,<13.0.0; python_version >= '3.10'",
]

mobile = [
    "buildozer>=1.5.0",
]

[project.scripts]
qyro = "qyro.cmdline.app:main"

[tool.poetry]
package-mode = true

packages = [{ include = "qyro" }]

classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[tool.poetry.group.dev.dependencies]
pytest = [
    { version = ">=6.2.0,<7.0.0", python = ">=3.7,<3.8" },
    { version = ">=7.0.0,<8.0.0", python = ">=3.8,<3.9" },
    { version = ">=8.0.0,<9.0.0", python = ">=3.9,<3.10" },
    { version = ">=9.0.0", python = ">=3.10,<3.16" },
]
pytest-cov = ">=4.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
