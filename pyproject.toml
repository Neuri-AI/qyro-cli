
[project]
name = "qyro-cli"
version = "1.0.0"
description = "A CLI for Qyro Engine app generator"
authors = [{ name = "Neuri", email = "ppg@neuri.ai" }]
maintainers = [
    { name = "Luis Alfredo De Los Reyes", email = "alfredo@neuri.ai" },
]
dynamic = ["classifiers"]
keywords = [
    "ppg", "python", "pyqt", "pyside", "desktop", "application",
    "generator", "cli", "component", "state management", "pyside6"
]
license = "MIT"
requires-python = ">=3.10,<3.16"
readme = "README.md"

dependencies = [
    "requests>=2.34.2,<3.0.0",
    "semver>=3.1.0,<4.0.0",
    "rich>=15.0.0,<16.0.0",
    "prompt-toolkit>=3.0.53,<4.0.0",
    "questionary>=2.1.1,<3.0.0",
    "qyro-engine @ git+https://github.com/Neuri-AI/qyro-engine.git",
]

[project.optional-dependencies]
desktop = [
    "pyinstaller>=6.22.3,<7.0.0",
    "pillow>=11.0.0,<13.0.0",
]

mobile = [
    "buildozer>=1.5.0",
]

[project.scripts]
qyro = "qyro.cmdline.app:main"

[tool.poetry]
package-mode = true

packages = [{ include = "qyro" }]

classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.0"
pytest-cov = ">=4.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
